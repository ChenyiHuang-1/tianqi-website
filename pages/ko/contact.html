<!--
title: 문의 및 견적 요청 | Tianqi Materials
desc: 소재 견적, 패턴 견적, 샘플 또는 맞춤 디자인을 문의하십시오.
-->
<div class="page-head"><div class="wrap">
  <p class="crumbs"><a href="{{home}}">{{t_nav_home}}</a> / {{t_nav_contact}}</p>
  <h1>문의하기</h1>
  <p>소재 견적, 패턴 견적, 샘플 요청, 맞춤 프로젝트를 하나의 양식으로 문의하실 수 있습니다. 사양을 모르셔도 괜찮습니다. 용도만 설명해 주시면 됩니다.</p>
</div></div>
<div class="wrap section">
  <div class="inq">
    <form class="inquiry" id="inquiry" novalidate data-endpoint="{{form_endpoint}}" data-files="{{form_files}}">
      <fieldset class="full types"><legend class="label">어떤 문의이신가요?</legend>
        <label><input type="radio" name="inquiry_type" value="quote" checked> 소재 견적</label>
        <label><input type="radio" name="inquiry_type" value="pattern"> 패턴 견적</label>
        <label><input type="radio" name="inquiry_type" value="sample"> 샘플 요청</label>
        <label><input type="radio" name="inquiry_type" value="custom"> 맞춤 제작</label>
      </fieldset>
      <label>이름 <em>필수</em><input id="f-name" name="name" autocomplete="name" required></label>
      <label>이메일 <em>필수</em><input id="f-email" name="email" type="email" autocomplete="email" required></label>
      <label class="full">요청 사항 <em>필수</em><textarea id="f-msg" name="message" required placeholder="무엇을 제작하시며, 어떻게 인쇄하거나 사용하실 예정입니까?"></textarea></label>
      <label>회사명<input id="f-co" name="company" autocomplete="organization"></label>
      <label>국가 또는 지역<input id="f-country" name="country" autocomplete="country-name"></label>
      <label class="full">제품 또는 패턴 번호<input id="f-codes" name="product_or_pattern" class="code" placeholder="이전 페이지에서 자동으로 입력되며, 수정할 수 있습니다"></label>
      <label data-for="quote pattern sample custom">소재 종류<select id="f-kind" name="material_type"><option value="">—</option><option>종이 / 판지</option><option>필름</option><option>완제품</option><option>잘 모르겠음</option></select></label>
      <div class="qty" data-for="quote pattern custom"><label>수량<input id="f-qty" name="quantity" inputmode="decimal"></label><label>단위<select id="f-unit" name="unit"><option>매</option><option>kg</option><option>톤</option><option>미터</option><option>개</option></select></label></div>
      <label data-for="quote pattern custom">규격(mm)<input id="f-size" name="size"></label>
      <label data-for="quote pattern custom">평량(g/m²) 또는 두께(μm)<input id="f-gsm" name="weight_or_thickness"></label>
      <label data-for="quote pattern sample custom">최종 용도<input id="f-use" name="end_use"></label>
      <label data-for="quote pattern custom">희망 납기일<input id="f-date" name="delivery_date" type="date"></label>
      <label class="check full" data-for="quote pattern custom"><input type="checkbox" id="f-sample" name="sample_needed" value="yes"> 샘플을 받고 싶습니다</label>
      <label class="full" data-files-only hidden>첨부 파일<input id="f-file" name="attachment" type="file"><span class="small">{{file_note}}</span></label>
      <input class="hp" name="website" tabindex="-1" autocomplete="off" aria-hidden="true">
      <p class="form-msg full" id="form-msg" aria-live="polite"></p>
      <button class="btn primary full" type="submit">보내기</button>
      <p class="small full" id="form-off" hidden>온라인 양식이 아직 연결되지 않아 이 양식으로는 전송할 수 없습니다.</p>
    </form>
    <aside class="direct">
      <p class="label">직접 연락</p>
      <p><b>{{legal_name}}</b><br>{{address}}</p>
      {{contact_direct}}
    </aside>
  </div>
</div>
